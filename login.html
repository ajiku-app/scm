<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html,body{height:100%;}
  body{
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
    background:
      linear-gradient(180deg, rgba(6,10,16,.55), rgba(6,10,16,.82)),
      radial-gradient(1200px 700px at 78% 28%, rgba(91,156,216,.16), transparent 60%),
      url('assets/bg-biometric.jpg') center/cover no-repeat fixed;
  }
  /* Kartu "menyatu" dengan background: kaca transparan + blur, bukan panel solid biasa. */
  .login-card{
    width:100%;max-width:420px;border-radius:16px;padding:30px 28px;
    background:linear-gradient(165deg, rgba(26,32,39,.58), rgba(18,22,27,.68));
    border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    backdrop-filter:blur(18px) saturate(150%);
    box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(91,156,216,.10) inset, 0 1px 0 rgba(255,255,255,.06) inset;
  }
  .login-brand{display:flex;align-items:center;gap:8px;color:#c7d0da;font:600 12px 'Inter';letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
  .login-brand .dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block;box-shadow:0 0 8px var(--good);}
  .login-title{font-family:'Big Shoulders Display';font-weight:800;font-size:30px;letter-spacing:.01em;margin:0 0 4px;text-shadow:0 2px 12px rgba(0,0,0,.4);}
  .login-sub{color:#aab4bf;font-size:13.5px;margin:0 0 22px;line-height:1.5;}
  .lf-field{margin-bottom:14px;}
  .lf-field label{display:block;font-size:12.5px;color:#aab4bf;margin-bottom:6px;}
  .lf-field input{width:100%;background:rgba(10,13,17,.45);border:1px solid rgba(255,255,255,.14);border-radius:8px;color:var(--text);padding:10px 12px;font:500 14px 'Inter';outline:none;}
  .lf-field input:focus{border-color:var(--steel);box-shadow:0 0 0 3px rgba(91,156,216,.18);}
  .lf-btn{width:100%;background:var(--steel);color:#0d1116;border:none;border-radius:8px;padding:11px;font:700 14px 'Inter';cursor:pointer;margin-top:4px;box-shadow:0 6px 18px rgba(91,156,216,.3);}
  .lf-btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;}
  .lf-btn.secondary{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:var(--text);box-shadow:none;}
  .lf-msg{font-size:13px;line-height:1.55;border-radius:8px;padding:10px 12px;margin:0 0 16px;display:none;}
  .lf-msg.err{background:rgba(232,97,92,.16);border:1px solid rgba(232,97,92,.5);color:#ffd7d5;display:block;}
  .lf-msg.ok{background:rgba(51,199,126,.16);border:1px solid rgba(51,199,126,.5);color:#c9f3dd;display:block;}
  .lf-msg.info{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#c7d0da;display:block;}
  .lf-video-wrap{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-bottom:14px;border:1px solid rgba(255,255,255,.14);}
  .lf-video-wrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
  .lf-video-wrap.busy::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.35);}
  .lf-step{display:none;}
  .lf-step.active{display:block;}
  .lf-user-chip{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:9px 12px;margin-bottom:16px;font-size:13px;}
  .lf-user-chip a{color:var(--steel);text-decoration:none;font:600 12.5px 'Inter';}
  .lf-foot{text-align:center;margin-top:16px;color:#8b95a1;font-size:11.5px;}
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand"><span class="dot"></span>SUPER APP</div>
    <h1 class="login-title">SCM CONTROL TOWER</h1>
    <p class="login-sub">Data ini strategis. Masuk dengan akun terdaftar, lalu verifikasi wajah untuk membuka dashboard.</p>

    <div id="lfMsg" class="lf-msg"></div>

    <!-- Langkah 1: email + password -->
    <form id="lfPassStep" class="lf-step active" autocomplete="on">
      <div class="lf-field">
        <label for="lfEmail">Email</label>
        <input id="lfEmail" type="email" autocomplete="username" required value="aji.septaku@gmail.com">
      </div>
      <div class="lf-field">
        <label for="lfPass">Kata sandi</label>
        <input id="lfPass" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="lf-btn" id="lfPassBtn">Masuk</button>
    </form>

    <!-- Langkah 2: verifikasi wajah -->
    <div id="lfFaceStep" class="lf-step">
      <div class="lf-user-chip">
        <span id="lfWhoAmI">—</span>
        <a href="#" id="lfSignOut">Bukan Anda? Keluar</a>
      </div>
      <div class="lf-video-wrap" id="lfVideoWrap">
        <video id="lfVideo" muted playsinline></video>
      </div>
      <button type="button" class="lf-btn" id="lfFaceBtn">Verifikasi wajah</button>
      <button type="button" class="lf-btn secondary" id="lfEnrollLink" style="margin-top:8px;display:none;">Daftarkan wajah saya</button>
    </div>

    <div class="lf-foot">SCM Control Tower · Akses dijaga login + verifikasi wajah</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/face-verify.js"></script>
<script>
(function () {
  var sb = window.scmSupabase;
  var msgEl = document.getElementById('lfMsg');
  var passStep = document.getElementById('lfPassStep');
  var faceStep = document.getElementById('lfFaceStep');
  var passBtn = document.getElementById('lfPassBtn');
  var faceBtn = document.getElementById('lfFaceBtn');
  var enrollLink = document.getElementById('lfEnrollLink');
  var videoEl = document.getElementById('lfVideo');
  var videoWrap = document.getElementById('lfVideoWrap');
  var whoEl = document.getElementById('lfWhoAmI');
  var stream = null;
  var attempts = 0;

  function showMsg(text, kind) {
    msgEl.className = 'lf-msg ' + (kind || 'info');
    msgEl.textContent = text;
    msgEl.style.display = text ? 'block' : 'none';
  }
  function goTo(next) { window.location.replace(next || 'index.html'); }

  function paramStep() {
    var p = new URLSearchParams(window.location.search);
    return p.get('step');
  }

  async function enterFaceStep(session) {
    passStep.classList.remove('active');
    faceStep.classList.add('active');
    whoEl.textContent = (session.user.email || 'Akun') + ' — sesi terverifikasi, sekarang cek wajah';
    showMsg('Memuat model pengenalan wajah…', 'info');
    try {
      await SCM_FACE.loadModels();
      showMsg('Arahkan wajah ke kamera, lalu klik Verifikasi wajah.', 'info');
      videoWrap.classList.remove('busy');
      stream = await SCM_FACE.startCamera(videoEl);
    } catch (e) {
      showMsg('Kamera tidak bisa diakses: ' + (e.message || e) + '. Pastikan izin kamera diaktifkan dan halaman dibuka lewat HTTPS atau localhost.', 'err');
    }
  }

  async function doPasswordLogin(ev) {
    ev.preventDefault();
    showMsg('', '');
    passBtn.disabled = true;
    passBtn.textContent = 'Memeriksa…';
    try {
      var email = document.getElementById('lfEmail').value.trim();
      var password = document.getElementById('lfPass').value;
      var res = await sb.auth.signInWithPassword({ email: email, password: password });
      if (res.error) throw res.error;
      if (!res.data || !res.data.session) throw new Error('Login gagal, coba lagi.');
      sessionStorage.removeItem('scm_face_ok');
      await enterFaceStep(res.data.session);
    } catch (e) {
      showMsg('Gagal masuk: ' + (e.message || 'email atau kata sandi salah.'), 'err');
    } finally {
      passBtn.disabled = false;
      passBtn.textContent = 'Masuk';
    }
  }

  async function doFaceVerify() {
    showMsg('Mengambil gambar…', 'info');
    faceBtn.disabled = true;
    videoWrap.classList.add('busy');
    try {
      var descriptor = await SCM_FACE.captureDescriptor(videoEl);
      var sessRes = await sb.auth.getSession();
      var token = sessRes.data && sessRes.data.session && sessRes.data.session.access_token;
      if (!token) throw new Error('Sesi login sudah berakhir, silakan masuk ulang.');

      var resp = await fetch(window.SCM_SUPABASE_URL + '/functions/v1/verify-face', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: window.SCM_SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token },
        body: JSON.stringify({ descriptor: descriptor }),
      });
      var body = await resp.json().catch(function () { return {}; });

      if (resp.ok && body.verified === true) {
        SCM_FACE.stopCamera(stream);
        var u = (await sb.auth.getUser()).data.user;
        sessionStorage.setItem('scm_face_ok', u.id);
        showMsg('Wajah cocok. Membuka dashboard…', 'ok');
        var dest = (new URLSearchParams(window.location.search)).get('next') || 'index.html';
        setTimeout(function () { goTo(dest); }, 400);
        return;
      }

      if (resp.ok && body.reason === 'not_enrolled') {
        showMsg('Wajah Anda belum terdaftar di sistem ini. Daftarkan dulu wajah Anda.', 'err');
        enrollLink.style.display = 'block';
      } else {
        attempts++;
        showMsg('Wajah tidak cocok dengan data terdaftar (percobaan ke-' + attempts + '). Coba lagi dengan pencahayaan lebih baik.', 'err');
        if (attempts >= 5) showMsg('Sudah 5 kali gagal. Untuk keamanan, silakan hubungi admin bila ini akun Anda.', 'err');
      }
    } catch (e) {
      showMsg(e.message || 'Verifikasi wajah gagal, coba lagi.', 'err');
    } finally {
      faceBtn.disabled = false;
      videoWrap.classList.remove('busy');
    }
  }

  document.getElementById('lfSignOut').addEventListener('click', async function (ev) {
    ev.preventDefault();
    SCM_FACE.stopCamera(stream);
    sessionStorage.removeItem('scm_face_ok');
    await sb.auth.signOut();
    window.location.reload();
  });
  enrollLink.addEventListener('click', function () { window.location.href = 'enroll.html'; });
  passStep.addEventListener('submit', doPasswordLogin);
  faceBtn.addEventListener('click', doFaceVerify);

  // Kalau sesi login sudah ada (mis. diarahkan ke sini oleh auth-guard.js karena
  // wajah belum diverifikasi di tab ini), langsung lompat ke langkah wajah.
  (async function init() {
    var sessRes = await sb.auth.getSession();
    var session = sessRes.data && sessRes.data.session;
    if (session && paramStep() === 'face') {
      await enterFaceStep(session);
    } else if (session && sessionStorage.getItem('scm_face_ok') === session.user.id) {
      goTo('index.html');
    }
  })();
})();
</script>
</body>
</html>
