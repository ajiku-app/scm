<title>Masuk — SCM Control Tower</title>
</head>
<body>
<div class="bg"></div>
<div class="lg">
  <div class="top">
    <div class="mk"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg></div>
    <h1>Selamat datang kembali</h1>
    <p>Masuk dengan akun Anda, lalu verifikasi wajah untuk membuka SCM Control Tower.</p>
  </div>
  <div class="sheet">
    <div id="lfMsg" class="lf-msg"></div>

    <form id="lfPassStep" class="lf-step active" autocomplete="on">
      <div class="lf-field"><label for="lfEmail">Email</label><input id="lfEmail" type="email" placeholder="nama@perusahaan.com" autocomplete="username" required></div>
      <div class="lf-field"><label for="lfPass">Kata sandi</label><input id="lfPass" type="password" placeholder="••••••••" autocomplete="current-password" required></div>
      <button type="submit" class="lf-btn" id="lfPassBtn">Masuk</button>
    </form>

    <div id="lfFaceStep" class="lf-step">
      <div class="lf-user-chip"><span id="lfWhoAmI">—</span><a href="#" id="lfSignOut">Bukan Anda? Keluar</a></div>
      <div class="lf-video-wrap" id="lfVideoWrap"><video id="lfVideo" muted playsinline></video></div>
      <div id="lfMood" class="lf-mood"><span class="lf-mood-emoji" id="lfMoodEmoji">🙂</span><span><b id="lfMoodLabel">—</b><span class="lf-mood-note" id="lfMoodNote"></span></span></div>
      <button type="button" class="lf-btn" id="lfFaceBtn">Verifikasi wajah</button>
      <button type="button" class="lf-btn secondary" id="lfEnrollLink" style="margin-top:8px;display:none;">Daftarkan wajah saya</button>
    </div>

    <div class="lf-foot">Akses dijaga login + verifikasi wajah</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="/assets/supabase-client.js"></script>
<script src="/assets/face-verify.js"></script>
<script src="/assets/login-page.js"></script>
</body>
</html>
